<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Satellite image tiles with changed areas highlighted">
  <style>
    .chg { opacity: 0; animation: chg 5s linear infinite; }
    .chg2 { animation-delay: 0.35s; }
    .chg3 { animation-delay: 0.7s; }
    .sweep { opacity: 0; animation: sweep 5s linear infinite; }
    @keyframes sweep {
      0%   { transform: translateY(0);    opacity: 0; }
      4%   { opacity: 1; }
      34%  { transform: translateY(38px); opacity: 1; }
      40%  { transform: translateY(38px); opacity: 0; }
      100% { transform: translateY(38px); opacity: 0; }
    }
    @keyframes chg { 0%, 12% { opacity: 0; } 20% { opacity: 1; } 78% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .chg { animation: none; opacity: 1; }
      .sweep { display: none; animation: none; }
    }
  </style>
  <g fill="#8b949e" fill-opacity="0.38">
    <rect x="5" y="5" width="11" height="11" rx="2"/>
    <rect x="18.5" y="5" width="11" height="11" rx="2"/>
    <rect x="32" y="5" width="11" height="11" rx="2"/>
    <rect x="5" y="18.5" width="11" height="11" rx="2"/>
    <rect x="18.5" y="18.5" width="11" height="11" rx="2"/>
    <rect x="32" y="18.5" width="11" height="11" rx="2"/>
    <rect x="5" y="32" width="11" height="11" rx="2"/>
    <rect x="18.5" y="32" width="11" height="11" rx="2"/>
    <rect x="32" y="32" width="11" height="11" rx="2"/>
  </g>
  <g fill="#d29922">
    <rect class="chg" x="18.5" y="5" width="11" height="11" rx="2"/>
    <rect class="chg chg2" x="5" y="18.5" width="11" height="11" rx="2"/>
    <rect class="chg chg3" x="32" y="32" width="11" height="11" rx="2"/>
  </g>
  <path class="sweep" d="M3 5H45" stroke="#2f81f7" stroke-width="2" stroke-linecap="round"/>
</svg>
