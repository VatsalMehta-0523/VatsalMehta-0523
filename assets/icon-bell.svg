<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Alarm bell ringing">
  <style>
    .bell { transform-origin: 24px 8px; animation: ring 4s ease-in-out infinite; }
    .wave { opacity: 0; animation: wave 4s linear infinite; }
    @keyframes ring {
      0%, 55% { transform: rotate(0deg); }
      61%     { transform: rotate(-13deg); }
      68%     { transform: rotate(11deg); }
      75%     { transform: rotate(-8deg); }
      82%     { transform: rotate(5deg); }
      89%, 100% { transform: rotate(0deg); }
    }
    @keyframes wave { 0%, 56% { opacity: 0; } 64% { opacity: 1; } 84% { opacity: 1; } 94%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .bell { animation: none; }
      .wave { animation: none; opacity: 1; }
    }
  </style>
  <g class="wave" fill="none" stroke="#d29922" stroke-width="2" stroke-linecap="round">
    <path d="M8 11C5.5 14.5 5.5 20 8 23.5"/>
    <path d="M40 11C42.5 14.5 42.5 20 40 23.5"/>
  </g>
  <g class="bell" fill="none" stroke="#2f81f7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M24 8C17.5 8 13.5 13 13.5 19.5V27.5L10 33.5H38L34.5 27.5V19.5C34.5 13 30.5 8 24 8Z"/>
    <path d="M20 38.5C20.6 40.4 22.2 41.5 24 41.5C25.8 41.5 27.4 40.4 28 38.5"/>
  </g>
</svg>
