<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Number plate being scanned">
  <style>
    .ch { opacity: 0.25; }
    .c1 { animation: c1 4.5s linear infinite; }
    .c2 { animation: c2 4.5s linear infinite; }
    .c3 { animation: c3 4.5s linear infinite; }
    .c4 { animation: c4 4.5s linear infinite; }
    .scan { opacity: 0; animation: scan 4.5s linear infinite; }
    @keyframes scan {
      0%   { transform: translateX(0);    opacity: 0; }
      4%   { opacity: 1; }
      55%  { transform: translateX(38px); opacity: 1; }
      60%  { transform: translateX(38px); opacity: 0; }
      100% { transform: translateX(38px); opacity: 0; }
    }
    @keyframes c1 { 0%, 11% { opacity: 0.25; } 14% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
    @keyframes c2 { 0%, 22% { opacity: 0.25; } 25% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
    @keyframes c3 { 0%, 34% { opacity: 0.25; } 37% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
    @keyframes c4 { 0%, 46% { opacity: 0.25; } 49% { opacity: 1; } 88% { opacity: 1; } 96%, 100% { opacity: 0.25; } }
    @media (prefers-reduced-motion: reduce) {
      .ch { animation: none; opacity: 1; }
      .scan { display: none; animation: none; }
    }
  </style>
  <rect x="5" y="14" width="38" height="20" rx="3.5" fill="none" stroke="#8b949e" stroke-width="2"/>
  <g fill="#2f81f7">
    <rect class="ch c1" x="10" y="20" width="5" height="8" rx="1"/>
    <rect class="ch c2" x="18" y="20" width="5" height="8" rx="1"/>
    <rect class="ch c3" x="26" y="20" width="5" height="8" rx="1"/>
    <rect class="ch c4" x="34" y="20" width="5" height="8" rx="1"/>
  </g>
  <path class="scan" d="M5 9V39" stroke="#d29922" stroke-width="2" stroke-linecap="round"/>
</svg>
